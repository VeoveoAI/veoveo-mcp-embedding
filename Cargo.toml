[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/VeoveoAI/veoveo-mcp-embedding"
publish = false

[workspace.dependencies]
# veoveo-core, pinned to one revision for every core crate.
veoveo-fixtures = { git = "https://github.com/VeoveoAI/veoveo-core", rev = "120306eb969c6134dadd422dca701a2ce63e9492" }
veoveo-store = { git = "https://github.com/VeoveoAI/veoveo-core", rev = "120306eb969c6134dadd422dca701a2ce63e9492" }
veoveo-types = { git = "https://github.com/VeoveoAI/veoveo-core", rev = "120306eb969c6134dadd422dca701a2ce63e9492" }
veoveo-usage = { git = "https://github.com/VeoveoAI/veoveo-core", rev = "120306eb969c6134dadd422dca701a2ce63e9492" }
chrono = { version = "=0.4.45", default-features = false, features = ["serde", "clock"] }

# The Rust SDK for Veoveo MCP servers: the contract feature for declarations, the server
# feature for hosting, registration and the forwarded identity.
veoveo-hub-sdk = { git = "https://github.com/VeoveoAI/veoveo-hub-sdk", rev = "6b965cae157229660c3def2f487d42554e2f8596", default-features = false }
# Artifact contract shares the exact published SDK revision above.
veoveo-mcp-artifact = { git = "https://github.com/VeoveoAI/veoveo-mcp-artifact", rev = "5fb8e1faf8d99a7a4105cad2eecbe4b5db921240", default-features = false }
veoveo-hub-sdk-fixture = { git = "https://github.com/VeoveoAI/veoveo-hub-sdk", rev = "6b965cae157229660c3def2f487d42554e2f8596" }
serde_json_canonicalizer = "=0.3.2"
sha2 = "=0.11.0"

anyhow = "=1.0.104"
# Synthetic HTTP transfer fixture; same release already selected by the SDK.
axum = "=0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
dotenvy = "0.15.7"
# The SDK's HTTP client release; registration and the tests share it.
reqwest = { version = "=0.13.5", default-features = false }
# The rmcp fork the SDK pins; the tool router uses its macros.
rmcp = { version = "=3.5.0", git = "https://github.com/VeoveoAI/rust-sdk", rev = "917e7914c93975fc1eddbff8792f1e2de933bc17" }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
secrecy = "0.10.3"
tempfile = "=3.27.0"
tracing = "0.1.44"
url = "=2.5.8"

schemars = { version = "1.2.2", features = ["uuid1"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
# PostgreSQL 18 through the same sqlx release and features as veoveo-core. `sqlx-toml`
# reads the crate's migration table from its `sqlx.toml`.
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-native-roots", "uuid", "chrono", "json", "migrate", "macros", "sqlx-toml"] }
thiserror = "=2.0.21"
tokio = "1.53.1"
# The exact release veoveo-types pins.
uuid = { version = "=1.25.0", default-features = false, features = ["serde", "std", "v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
