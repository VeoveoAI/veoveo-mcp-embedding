[package]
name = "veoveo-mcp-embedding"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["server"]
# The server's public types: model identities, resource addresses, tool
# requests and results and the permission vocabulary. No database or runtime dependency.
contract = [
    "dep:schemars",
    "dep:serde",
    "dep:thiserror",
    "dep:uuid",
    "dep:veoveo-hub-sdk",
    "dep:veoveo-types",
    "dep:serde_json",
]
# The SDK's knowledge Embedder over this server's typed embed tool, through a
# caller-bound HubClient: what a knowledge source depends on to embed its records.
client = ["contract", "veoveo-hub-sdk/client"]
# The hosted server: MCP through the SDK, native Core usage and the binary. It includes
# the client so the server's tests exercise it.
server = [
    "client",
    "veoveo-hub-sdk/server",
    "dep:anyhow",
    "dep:clap",
    "dep:dotenvy",
    "dep:reqwest",
    "dep:rmcp",
    "dep:rustls",
    "dep:secrecy",
    "dep:serde_json",
    "dep:sqlx",
    "dep:tokio",
    "tokio/rt-multi-thread",
    "tokio/macros",
    "tokio/signal",
    "dep:tracing",
    "dep:url",
    "dep:veoveo-skills",
    "dep:veoveo-store",
    "dep:veoveo-usage",
    "dep:chrono",
    "dep:sha2",
    "dep:serde_json_canonicalizer",
    "reqwest/json",
    "reqwest/stream",
]

[build-dependencies]
# Embeds the skills under skills/ at build time.
veoveo-skills = { workspace = true, features = ["build"] }

[dependencies]
veoveo-skills = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
veoveo-hub-sdk = { workspace = true, features = ["contract"], optional = true }
veoveo-types = { workspace = true, optional = true }

anyhow = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
dotenvy = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["rustls-no-provider"], optional = true }
rmcp = { workspace = true, features = ["server", "macros", "schemars", "transport-streamable-http-server"], optional = true }
rustls = { workspace = true, optional = true }
secrecy = { workspace = true, optional = true }
serde_json = { workspace = true, features = ["raw_value"], optional = true }
sqlx = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["sync", "time", "net"] }
tracing = { workspace = true, optional = true }
url = { workspace = true, optional = true }
veoveo-store = { workspace = true, optional = true }
veoveo-usage = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
serde_json_canonicalizer = { workspace = true, optional = true }

[dev-dependencies]
axum.workspace = true
tempfile.workspace = true
sha2.workspace = true
veoveo-hub-sdk-fixture.workspace = true
veoveo-hub-sdk = { workspace = true, features = ["server", "testing"] }
# `database-conformance` holds the crate's queries and schema to core's database rules.
veoveo-fixtures = { workspace = true, features = ["store", "database-conformance"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }

[[bin]]
name = "veoveo-mcp-embedding"
required-features = ["server"]

[[test]]
name = "database_conformance"
required-features = ["server"]

[[test]]
name = "mcp"
required-features = ["server"]

[[test]]
name = "sql_confinement"
required-features = ["server"]

[[test]]
name = "generation"
required-features = ["server"]

[[test]]
name = "acceptance"
required-features = ["server"]

[[test]]
name = "validation"
required-features = ["server"]

[[test]]
name = "composition"
required-features = ["server"]

[[test]]
name = "embedder"
required-features = ["server"]
